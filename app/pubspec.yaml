name: guitar_school
description: "Гитарная школа: видеокурсы и разборы песен."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  activation_key:
    path: ../packages/activation_key
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  supabase_flutter: ^2.18.2
  video_player: ^2.14.1
  pdfrx: ^2.6.5
  path_provider: ^2.1.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Manrope не содержит таджикских букв — их рисует InterTajik
  # (подмножество Inter только из Ғ Ӣ Қ Ӯ Ҳ Ҷ). Лицензии: assets/fonts/OFL-*.txt
  fonts:
    # Иконки Lucide: в release-сборке остаются только используемые значки.
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: InterTajik
      fonts:
        - asset: assets/fonts/InterTajik-Regular.ttf
          weight: 400
        - asset: assets/fonts/InterTajik-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterTajik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterTajik-Bold.ttf
          weight: 700
        - asset: assets/fonts/InterTajik-ExtraBold.ttf
          weight: 800
